name: Validación de propuesta regional

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - name: Validar Excel, regiones y balance de Centro Norte
        run: python ACTUALIZAR_MAPA.py --check
      - name: Comprobar scripts de navegación
        run: |
          node --check static/planning/app.js
          node --check static/planning/core.js
      - name: Pruebas Python y consistencia regional
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Propuestas, tomar, ceder, aperturas y exportación
        run: node --test tests/planning.test.cjs
