<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#006241">
  <meta name="description" content="Regiones Starbucks, directorio por DM, tiendas y aperturas con propuestas guardadas. Filtra por región, consulta el span por DM y revisa la cobertura en un solo mapa.">
  <title>Centro Norte · Regional de tiendas</title>
  <link rel="icon" href="static/planning/compass.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/vendor/leaflet.css">
  <link rel="stylesheet" href="static/vendor/MarkerCluster.css">
  <link rel="stylesheet" href="static/planning/planning.css?v=4.0.0">
  <link rel="stylesheet" href="static/planning/quality.css?v=4.0.0">
  <link rel="stylesheet" href="static/planning/regional.css?v=4.1.0">
  <link rel="stylesheet" href="static/planning/map-view.css?v=4.5.0">
  <script defer src="static/vendor/leaflet.js"></script>
  <script defer src="static/vendor/leaflet.markercluster.js"></script>
  <script defer src="static/planning/geography.js"></script>
  <script defer src="static/planning/base.js?v=7a81f6bb03ea3628f96c-70e3e808"></script>
  <script defer src="static/planning/insights.js?v=7a81f6bb03ea3628f96c-70e3e808"></script>
  <script defer src="static/planning/core.js?v=4.5.0"></script>
  <script defer src="static/planning/app.js?v=4.5.0"></script>
</head>
<body class="map-first region-planner">
  <a class="skip-link" href="#search">Buscar una tienda</a>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Centro Norte, inicio"><img src="static/planning/compass.svg" alt=""><span>CENTRO NORTE<small>REGIONAL · SPAN DE TIENDAS</small></span></a>
    <span class="header-context">Tiendas y aperturas <i>·</i> Planeación regional</span>
    <nav class="header-actions" aria-label="Acciones de propuesta">
      <button id="reviewBtn" class="health-badge" aria-label="Revisar base de datos"><span class="health-dot"></span><span id="healthText">Validando…</span></button>
      <button id="summaryBtn" class="secondary">Mis cambios <b id="changesCount">0</b></button>
      <button id="guideBtn" class="quiet" aria-label="Cómo usar el mapa">?</button>
      <button id="exportBtn" class="primary">Exportar ↗</button>
    </nav>
  </header>
  <button id="menusToggle" class="menus-toggle" aria-pressed="false" aria-label="Ocultar menús y ampliar el mapa"><span class="menu-toggle-icon" aria-hidden="true">⛶</span><span id="menusToggleText">Ocultar menús</span></button>
  <main class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="Filtrar por región y DM" hidden>
      <div class="sidebar-heading"><button id="closeListBtn" class="close-list" aria-label="Cerrar región">×</button><div class="eyebrow" id="directoryContext">BASE ACTUAL · DIRECTORIO</div><h1>Región</h1><p>Elige región, despliega un DM y ubica su tienda.</p></div>
      <div class="filters">
        <label class="region-select-label">Región Starbucks<select id="regionFilter"><option value="">Todas las disponibles</option></select></label>
        <label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Buscar DM, tienda o CeCo" autocomplete="off" aria-label="Buscar tienda, CeCo, DM o municipio"><span class="key">/</span></label>
        <div class="directory-options"><label><input id="includeOpenings" type="checkbox" checked>Ver aperturas <b id="openingCount">3</b></label><button id="clearFilters" class="link-button">Limpiar</button></div>
        <div id="activeDm" class="active-dm" hidden></div>
        <details class="more-filters"><summary>Más filtros <span aria-hidden="true">+</span></summary><div class="filter-grid"><label>Zona del fondo<select id="zoneFilter"><option value="">Todas las zonas</option></select></label><label>Movimiento<select id="decisionFilter"><option value="">Todas las decisiones</option></select></label></div><button id="backgroundBtn" class="link-button">Ajustar fondo INEGI</button></details>
        <div class="filter-actions"><span id="filterCount"></span><button id="expandDms" class="link-button">Desplegar DM</button></div>
      </div>
      <div class="list-tools"><label class="select-visible"><input type="checkbox" id="selectVisible">Seleccionar visibles</label><button id="fitDirectory" class="link-button">Centrar ↗</button></div>
      <div class="store-list" id="storeList" aria-label="Directorio por región, DM y tienda"></div>
      <div class="sidebar-footer"><button id="validateDirectory" class="link-button">Validar datos</button><a href="cms/Mapa_CentroNorte_CMS.xlsx" download>Excel CMS ↓</a></div>
    </aside>
    <section class="map-workspace" aria-label="Mapa de tiendas y propuesta regional">
      <div id="map" role="region" aria-label="Tiendas y aperturas con pines por región Starbucks y fondo geográfico INEGI"></div>
      <nav class="map-launchers" aria-label="Controles del mapa">
        <button id="mobileListBtn" aria-expanded="false" aria-controls="sidebar"><span aria-hidden="true">☰</span> Región</button>
        <div class="view-switch" role="group" aria-label="Comparar base actual y propuesta"><button data-view="base" aria-pressed="true">Base actual</button><button data-view="proposal" aria-pressed="false">Mi propuesta</button></div>
        <button id="auditBtn"><span aria-hidden="true">◎</span> Auditoría <b id="auditCount">0</b></button>
      </nav>
      <div id="storeCounter" class="store-counter" aria-live="polite"></div>
      <div class="map-tools"><button id="fitBtn" title="Centrar tiendas filtradas" aria-label="Centrar tiendas filtradas">⌖</button><button id="areaBtn" title="Seleccionar tiendas en un área" aria-label="Seleccionar tiendas en un área">▣</button><button id="undoBtn" title="Deshacer último cambio" aria-label="Deshacer último cambio" disabled>↶</button></div>
      <div class="map-status" id="mapStatus"><span class="live-dot"></span><span>Selecciona una tienda para ajustar su región</span></div>
      <div id="regionLegend" class="region-legend" aria-label="Colores y filtro por región Starbucks"></div>
      <div class="legend" id="legend" aria-label="Colores del fondo geográfico"></div>
      <div class="map-context"><span id="tileStatus">Cartografía local lista</span><button id="sourcesBtn">Límites INEGI · zonas por orientación ⓘ</button></div>
      <aside class="inspector hidden" id="inspector" aria-label="Proponer región de la tienda"></aside>
      <div class="selection-dock hidden" id="selectionDock"></div>
      <div class="map-steps hidden" id="mapSteps"><button id="dismissSteps" aria-label="Ocultar ayuda">×</button></div>
    </section>
  </main>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <dialog id="modal"><div id="modalContent"></div></dialog>
  <noscript>Activa JavaScript para utilizar el mapa.</noscript>
</body>
</html>
